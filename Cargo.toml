[package]
name = "youtui"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast terminal interface for searching, queueing, and playing YouTube videos"
license = "MIT"
repository = "https://github.com/McBrosa/youtui"
readme = "README.md"
keywords = ["youtube", "tui", "terminal", "media", "ratatui"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
colored = "3"
tempfile = "3"
ctrlc = "3"
anyhow = "1"
which = "8"
ratatui = "0.30.2"
crossterm = "0.29"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
dirs = "6"
libc = "0.2"
ratatui-image = "11"
image = { version = "0.25.10", default-features = false }
base64-simd = "0.8.0"

[dev-dependencies]
vt100 = "0.16"

[profile.release]
strip = true
lto = true
codegen-units = 1
